name: FridgeChef
options:
  bundleIdPrefix: com.fridgechef
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.2

targets:
  FridgeChef:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    configFiles:
      Debug: Debug.xcconfig
      Release: Release.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fridgechef.app
        PRODUCT_NAME: FridgeChef
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

  FridgeChefTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: FridgeChef
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FridgeChef:
    build:
      targets:
        FridgeChef: all
        FridgeChefTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FridgeChefTests
    archive:
      config: Release
